version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3 
    environment:
      POSTGRES_DB: mygeodb
      POSTGRES_USER: myprojectuser
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    working_dir: /code/backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgis://myprojectuser:mypassword@db:5432/mygeodb
    depends_on:
      - db

  frontend:
    build: ./frontend 
    ports:
      - "5173:5173" 
    volumes:
      - ./frontend:/app 
      - /app/node_modules 
    environment:
      - VITE_API_URL=http://localhost:8000 
    depends_on:
      - web

volumes:
  postgres_data: