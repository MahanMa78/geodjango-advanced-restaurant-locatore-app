
services:
  db:
    image: postgis/postgis:15-3.3 
    container_name: geodjangodemo_db
    environment:
      POSTGRES_DB: mygeodb
      POSTGRES_USER: myprojectuser
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: geodjangodemo_redis
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: geodjangodemo_web
    working_dir: /code/backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - DATABASE_URL=postgis://myprojectuser:mypassword@db:5432/mygeodb
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  celery:
    build: .
    container_name: geodjangodemo_celery
    working_dir: /code/backend
    command: celery -A backend worker -l info
    volumes:
      - .:/code
    environment:
      - DATABASE_URL=postgis://myprojectuser:mypassword@db:5432/mygeodb
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend 
    container_name: geodjangodemo_frontend
    ports:
      - "5173:5173" 
    volumes:
      - ./frontend:/app 
      - /app/node_modules 
    environment:
      - VITE_API_URL=http://localhost:8000 
    depends_on:
      - web

volumes:
  postgres_data: